server:
  port: 8083

spring:
  application:
    name: telemetry-storage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetry}
    username: ${SPRING_DATASOURCE_USERNAME:fleet}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetpass}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: telemetry-storage
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.fleet.common.dto.DecodedTelemetry
        spring.json.trusted.packages: com.fleet.common.dto
        spring.json.use.type.headers: false

topic:
  decoded: ${TOPIC_DECODED:decoded-telemetry}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: telemetry-storage

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fleet: INFO
