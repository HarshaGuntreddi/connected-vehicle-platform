server:
  port: 8082

spring:
  application:
    name: dbc-decoder-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dbc-decoder
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.fleet.common.dto.CanFrame
        spring.json.trusted.packages: com.fleet.common.dto
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

topic:
  raw-can: ${TOPIC_RAW_CAN:raw-can-frames}
  decoded: ${TOPIC_DECODED:decoded-telemetry}

# DBC file location (classpath: or file:). Swap this to point at your own DBC.
dbc:
  file: ${DBC_FILE:classpath:sample.dbc}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: dbc-decoder

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fleet: INFO
