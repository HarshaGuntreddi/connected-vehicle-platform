# Tells Grafana to load dashboard JSON files from the provisioning path.
apiVersion: 1

providers:
  - name: connected-vehicle
    orgId: 1
    folder: Connected Vehicle
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
